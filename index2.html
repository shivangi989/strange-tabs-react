<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strange Tabs | Chrome Extension</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 40px; }
        .card { background: #1e293b; max-width: 600px; margin: auto; padding: 30px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        h1 { color: #818cf8; margin-bottom: 10px; }
        .features { text-align: left; display: inline-block; margin: 20px 0; }
        .btn { background-color: #6366f1; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; transition: 0.3s; }
        .btn:hover { background-color: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Strange Tabs</h1>
        <p>A high-performance tab management extension built with JavaScript.</p>
        <div class="features">
            <ul>
                <li>Save current browser sessions with custom names.</li>
                <li>Instant restoration of all saved tabs via Chrome Storage API.</li>
                <li>Dynamic session management (Edit/Delete).</li>
            </ul>
        </div>
        <br>
        <a href="https://github.com/shivangi989/strange-tabs-extension" class="btn">View Source on GitHub</a>
    </div>
</body>
</html>
